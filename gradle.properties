org.gradle.caching=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official

# Where the embedded-mongodb Android library is checked out, as an included build. Relative
# paths are resolved against this directory; override it in ~/.gradle/gradle.properties or on
# the command line when the two repositories are not siblings.
embeddedMongoAndroidDir=../embedded-mongo/android
