[versions]
# Kept in step with the library's own catalog: a composite build compiles both with one Kotlin
# compiler and one AGP, so a version that disagrees with android/gradle/libs.versions.toml in
# the library repository fails the build rather than resolving to two of anything.
agp = "8.13.2"
kotlin = "2.2.21"
bson = "5.10.0"
coroutines = "1.11.0"

# Pinned to what Android Gradle plugin 8.13.2 and compileSdk 36 accept, which is what the
# library is built with. Anything newer demands AGP 9.1 and compileSdk 37, and the two builds
# have to agree.
activity-compose = "1.10.1"
compose-bom = "2025.06.01"
core-ktx = "1.16.0"
lifecycle = "2.9.1"
play-services-location = "21.3.0"

junit = "4.13.2"

# Compose UI tests run on the JVM under Robolectric rather than on a device: the rest of this
# application's tests need no emulator and neither should the screens. 4.16 is the first release
# with an android-all for API 36, which is this build's compileSdk.
robolectric = "4.16"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
bson = { module = "org.mongodb:bson", version.ref = "bson" }
# No version: the module is not published anywhere yet, and settings.gradle.kts substitutes the
# included build's project for it. A version here would be a version nobody could resolve.
embedded-mongodb = { module = "io.github.jeroenvervaeke:embedded-mongodb" }
# The Android-free half: databases, collections and queries, which is all `:data` needs.
embedded-mongodb-core = { module = "io.github.jeroenvervaeke:embedded-mongodb-core" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
